apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: smart-security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-org/smart-security/auth-service:latest
          ports:
            - containerPort: 4101
          envFrom:
            - configMapRef:
                name: platform-config
          readinessProbe:
            httpGet:
              path: /health
              port: 4101
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: smart-security
spec:
  selector:
    app: auth-service
  ports:
    - port: 4101
      targetPort: 4101
---
