version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartsecurity
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: smartsecurity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsecurity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_PATH: apps/api-gateway
    ports:
      - "4000:4000"
    environment:
      API_GATEWAY_PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4101
      DISPATCH_SERVICE_URL: http://dispatch-service:4102
      TRACKING_SERVICE_URL: http://tracking-service:4103
      INVENTORY_SERVICE_URL: http://inventory-service:4104
      REPORT_SERVICE_URL: http://report-service:4105
      NOTIFICATION_SERVICE_URL: http://notification-service:4106
      CLIENT_SERVICE_URL: http://client-service:4107
    depends_on:
      - auth-service
      - dispatch-service
      - tracking-service
      - inventory-service
      - report-service
      - notification-service
      - client-service

  auth-service:
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_PATH: apps/auth-service
    environment:
      AUTH_SERVICE_PORT: 4101
      JWT_SECRET: smart-security-dev-secret
      DATABASE_URL: postgres://smartsecurity:devpassword@postgres:5432/smartsecurity

  dispatch-service:
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_PATH: apps/dispatch-service
    environment:
      DISPATCH_SERVICE_PORT: 4102
      DATABASE_URL: postgres://smartsecurity:devpassword@postgres:5432/smartsecurity

  tracking-service:
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_PATH: apps/tracking-service
    environment:
      TRACKING_SERVICE_PORT: 4103
      DATABASE_URL: postgres://smartsecurity:devpassword@postgres:5432/smartsecurity

  inventory-service:
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_PATH: apps/inventory-service
    environment:
      INVENTORY_SERVICE_PORT: 4104
      DATABASE_URL: postgres://smartsecurity:devpassword@postgres:5432/smartsecurity

  report-service:
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_PATH: apps/report-service
    environment:
      REPORT_SERVICE_PORT: 4105
      DATABASE_URL: postgres://smartsecurity:devpassword@postgres:5432/smartsecurity

  notification-service:
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_PATH: apps/notification-service
    environment:
      NOTIFICATION_SERVICE_PORT: 4106
      DATABASE_URL: postgres://smartsecurity:devpassword@postgres:5432/smartsecurity

  client-service:
    build:
      context: ../..
      dockerfile: infra/docker/node-service.Dockerfile
      args:
        SERVICE_PATH: apps/client-service
    environment:
      CLIENT_SERVICE_PORT: 4107
      DATABASE_URL: postgres://smartsecurity:devpassword@postgres:5432/smartsecurity

volumes:
  postgres_data:
  redis_data:
