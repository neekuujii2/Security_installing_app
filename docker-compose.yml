services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: node apps/api-gateway/dist/index.js
    environment:
      API_GATEWAY_PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4101
      DISPATCH_SERVICE_URL: http://dispatch-service:4102
      TRACKING_SERVICE_URL: http://tracking-service:4103
      INVENTORY_SERVICE_URL: http://inventory-service:4104
      REPORT_SERVICE_URL: http://report-service:4105
      NOTIFICATION_SERVICE_URL: http://notification-service:4106
      CLIENT_SERVICE_URL: http://client-service:4107
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      auth-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      client-service:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: node apps/auth-service/dist/index.js
    environment:
      AUTH_SERVICE_PORT: 4101
      JWT_SECRET: smart-security-dev-secret
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4101/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  dispatch-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: node apps/dispatch-service/dist/index.js
    environment:
      DISPATCH_SERVICE_PORT: 4102
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4102/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  tracking-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: node apps/tracking-service/dist/index.js
    environment:
      TRACKING_SERVICE_PORT: 4103
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4103/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: node apps/inventory-service/dist/index.js
    environment:
      INVENTORY_SERVICE_PORT: 4104
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4104/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  report-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: node apps/report-service/dist/index.js
    environment:
      REPORT_SERVICE_PORT: 4105
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4105/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: node apps/notification-service/dist/index.js
    environment:
      NOTIFICATION_SERVICE_PORT: 4106
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4106/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  client-service:
    build:
      context: .
      dockerfile: infra/docker/node-service.Dockerfile
    command: node apps/client-service/dist/index.js
    environment:
      CLIENT_SERVICE_PORT: 4107
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4107/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    profiles: ["future-deps"]
    environment:
      POSTGRES_USER: smartsecurity
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: smartsecurity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["future-deps"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
